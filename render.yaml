# Review plans/region and supply sync:false values before applying this Blueprint.
services:
  - type: web
    name: onebodymusic-api
    runtime: node
    branch: develop
    region: frankfurt
    plan: starter
    rootDir: onebodymusic-backend
    buildCommand: npm ci --include=dev && npm run build:prod
    preDeployCommand: npm run deploy:migrate
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: onebodymusic-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: MEDIA_ENABLED
        value: 'true'
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: AUTH_COOKIE_SAME_SITE
        value: lax

databases:
  - name: onebodymusic-db
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: '17'
    databaseName: onebodymusic
    user: onebodymusic
    ipAllowList: []
